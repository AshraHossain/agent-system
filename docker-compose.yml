# Local OpsPilot AI + optional Jaeger OTLP trace viewer
# Usage:
#   docker compose up --build                     # OpsPilot ADK UI/API on http://127.0.0.1:8000
#   docker compose --profile otel up --build      # OpsPilot + Jaeger UI on http://127.0.0.1:16686
services:
  opspilot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPSPILOT_MODEL_PROVIDER: ${OPSPILOT_MODEL_PROVIDER:-mock}
      OPSPILOT_MODEL: ${OPSPILOT_MODEL:-gemini-2.5-flash}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
    volumes:
      - opspilot_var:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["otel"]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  opspilot_var:
