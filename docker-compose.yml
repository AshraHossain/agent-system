# NetPulse AI: SYNTHETIC DATA ONLY. Nothing here connects to or modifies a real network.
#
#   cp .env.example .env            # then set real tokens / OIDC settings and the audit key
#   docker compose up --build       # api on :8000, ui on :8501 (heuristic provider)
#   docker compose --profile ollama up --build   # adds a local Ollama server
#   docker compose exec ollama ollama pull qwen2.5:7b-instruct

x-netpulse: &netpulse
  build: .
  environment: &netpulse-env
    NETPULSE_AUTH_MODE: ${NETPULSE_AUTH_MODE:-tokens}
    NETPULSE_API_TOKENS: ${NETPULSE_API_TOKENS:-}
    NETPULSE_OIDC_ISSUER: ${NETPULSE_OIDC_ISSUER:-}
    NETPULSE_OIDC_AUDIENCE: ${NETPULSE_OIDC_AUDIENCE:-}
    NETPULSE_OIDC_ROLE_MAP: ${NETPULSE_OIDC_ROLE_MAP:-}
    NETPULSE_OIDC_JWKS_URL: ${NETPULSE_OIDC_JWKS_URL:-}
    NETPULSE_OIDC_ROLE_CLAIM: ${NETPULSE_OIDC_ROLE_CLAIM:-groups}
    NETPULSE_OIDC_TENANT_CLAIM: ${NETPULSE_OIDC_TENANT_CLAIM:-}
    NETPULSE_TENANT_DATASETS: ${NETPULSE_TENANT_DATASETS:-}
    NETPULSE_AUDIT_KEY: ${NETPULSE_AUDIT_KEY:?set NETPULSE_AUDIT_KEY in .env (32+ random characters)}
    NETPULSE_FOUR_EYES: ${NETPULSE_FOUR_EYES:-on}
    NETPULSE_JOB_LEASE_SECONDS: ${NETPULSE_JOB_LEASE_SECONDS:-60}
    NETPULSE_LLM_PROVIDER: ${NETPULSE_LLM_PROVIDER:-heuristic}
    NETPULSE_OLLAMA_URL: ${NETPULSE_OLLAMA_URL:-http://ollama:11434}
    NETPULSE_LOG_LEVEL: ${NETPULSE_LOG_LEVEL:-INFO}
    NETPULSE_LANGSMITH_TRACING: ${NETPULSE_LANGSMITH_TRACING:-false}

services:
  api:
    <<: *netpulse
    # uvicorn trusts X-Forwarded-For / -Proto only from FORWARDED_ALLOW_IPS (the proxy's fixed address below).
    command: ["uvicorn", "netpulse.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--workers", "${NETPULSE_PROCESSES:-1}"]
    environment:
      <<: *netpulse-env
      FORWARDED_ALLOW_IPS: 172.28.0.10
    ports:
      - "127.0.0.1:8000:8000"
    networks: [netpulse]
    volumes:
      - netpulse-db:/app/.netpulse
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  ui:
    build: .
    command: ["streamlit", "run", "netpulse/ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      # In oidc mode the API refuses plain http, so set NETPULSE_UI_API_URL to the https API address (via the proxy).
      NETPULSE_API_URL: ${NETPULSE_UI_API_URL:-http://api:8000}
      NETPULSE_UI_TOKEN: ${NETPULSE_UI_TOKEN:-}
      NETPULSE_UI_TOKEN_HEADER: ${NETPULSE_UI_TOKEN_HEADER:-}
    ports:
      - "127.0.0.1:8501:8501"
    networks: [netpulse]
    depends_on:
      api:
        condition: service_healthy

  # TLS termination and public exposure. Start with: docker compose --profile proxy up --build
  # Set NETPULSE_UI_DOMAIN and NETPULSE_API_DOMAIN to your public names; the *.localhost defaults only make Caddy
  # issue certificates from its own CA for local testing.
  proxy:
    image: caddy:2
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      NETPULSE_UI_DOMAIN: ${NETPULSE_UI_DOMAIN:-ui.localhost}
      NETPULSE_API_DOMAIN: ${NETPULSE_API_DOMAIN:-api.localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      netpulse:
        ipv4_address: 172.28.0.10
    depends_on: [api, ui]

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

networks:
  netpulse:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  caddy-data:
  netpulse-db:
  ollama-models:
