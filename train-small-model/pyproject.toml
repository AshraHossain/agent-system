[project]
name = "train-small-model"
version = "0.1.0"
description = "A teaching project: train a tiny character-level transformer from scratch on your own dataset."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",  # not used directly; silences a torch warning
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
