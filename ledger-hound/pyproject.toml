[project]
name = "ledger-hound"
version = "0.1.0"
description = "Agentic QA for a Purchase-to-Pay API: explorer, adversary and judge agents that hunt for financial-integrity bugs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic>=2",
    "openai-agents",
    "python-dotenv",
]

[project.scripts]
ledger-hound = "ledger_hound.cli:main"

[project.optional-dependencies]
dspy = [
    "dspy>=3.4.1",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_hound"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/ledger_hound"]
branch = true

[tool.coverage.report]
# 80 is a floor below the current 83% actual (branch coverage on), so it catches
# regressions without being brittle. Known-thin spots are the manual/terminal paths:
# cli.py (~48%), judge.py (~64%) and score.py (~52%) are exercised end-to-end by the
# CLI rather than by unit tests.
# Kept here rather than in `addopts` (matching the root project) so that running a
# single test file locally is not failed by a partial-run coverage figure; CI passes
# the --cov flags explicitly.
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# prompt prose and the impact table read better unwrapped
"src/ledger_hound/qa/brain.py" = ["E501"]
"src/ledger_hound/qa/labels.py" = ["E501"]
"tests/**" = ["S"]
