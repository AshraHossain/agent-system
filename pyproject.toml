[project]
name = "opspilot"
version = "0.1.0"
description = "OpsPilot AI — read-only multi-agent network operations investigation (Google ADK)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk[db]==2.11.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7,<3",
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.scripts]
opspilot = "opspilot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opspilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: requires live Gemini credentials (GOOGLE_API_KEY or Vertex AI); skipped by default",
    "slow: end-to-end runs across the full evaluation dataset",
]
addopts = "-m 'not live' -p no:cacheprovider"
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"opspilot/datasets/generate.py" = ["S311"]
