[project]
name = "opspilot"
version = "0.1.0"
description = "OpsPilot AI — read-only multi-agent network operations investigation (Google ADK)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk[db]==2.11.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7,<3",
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.scripts]
opspilot = "opspilot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opspilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: requires live Gemini credentials (GOOGLE_API_KEY or Vertex AI); skipped by default",
    "slow: end-to-end runs across the full evaluation dataset",
]
addopts = "-m 'not live' -p no:cacheprovider"
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["opspilot"]
branch = true

[tool.coverage.report]
# Offline suite only (live Gemini paths are excluded by design, see docs/model_configuration.md).
# 80 is a floor well below the current ~95% actual, so it catches real regressions without being
# brittle; opspilot/cli.py and opspilot/eval/harness.py are the known-thin spots (manual/live paths).
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",
]

[tool.coverage.html]
directory = "var/htmlcov"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"opspilot/datasets/generate.py" = ["S311"]
