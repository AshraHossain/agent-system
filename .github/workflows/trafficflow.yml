name: trafficflow
on:
  push:
    paths: ["traffic-flow-analyzer/**", ".github/workflows/trafficflow.yml"]
  pull_request:
    paths: ["traffic-flow-analyzer/**", ".github/workflows/trafficflow.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traffic-flow-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest --cov=trafficflow --cov-fail-under=70 --cov-report=term-missing
  docker:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: traffic-flow-analyzer
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t trafficflow-test .
  smoke:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    defaults:
      run:
        working-directory: traffic-flow-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run playwright install chromium
      - run: uv run pytest -m slow -x -q --no-cov
