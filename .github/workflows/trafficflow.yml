name: trafficflow
on:
  push:
    paths: ["traffic-flow-analyzer/**", ".github/workflows/trafficflow.yml"]
  pull_request:
    paths: ["traffic-flow-analyzer/**", ".github/workflows/trafficflow.yml"]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    defaults:
      run:
        working-directory: traffic-flow-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Download PeMSD7 dataset
        run: uv run trafficflow fetch-data --dest var/data
      - name: Run forecast benchmark
        id: bench
        run: |
          RESULT=$(uv run trafficflow evaluate var/data/PeMSD7_V_228.csv \
            --sensors 38 \
            --horizons 15 30 60 \
            --from-hour 6 --to-hour 20 \
            --period weekday)
          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Post benchmark comment
        uses: actions/github-script@v7
        with:
          script: |
            const raw = `${{ steps.bench.outputs.result }}`;
            let parsed;
            try { parsed = JSON.parse(raw); } catch { parsed = null; }

            let body = "## Forecast Benchmark Results\n\n";
            if (!parsed || !parsed.results) {
              body += "```\n" + raw + "\n```\n";
            } else {
              // Output schema: {horizons:[15,30,60], origins:N, segments:N, results:{...}}
              // results keys: "15min/all", "15min/peak", ... each has method sub-keys
              const results = parsed.results;
              const scenarios = Object.keys(results);
              const firstKey = scenarios[0];
              const methods = Object.keys(results[firstKey]).filter(m => m !== "interval_90");

              body += "| Scenario | " + methods.map(m => `${m} MAE`).join(" | ")
                    + " | " + methods.map(m => `${m} RMSE`).join(" | ") + " |\n";
              body += "|---|" + methods.map(() => "---").join("|")
                    + "|" + methods.map(() => "---").join("|") + "|\n";
              for (const [scenario, data] of Object.entries(results)) {
                const maes  = methods.map(m => data[m]?.mae?.toFixed(2)  ?? "—");
                const rmses = methods.map(m => data[m]?.rmse?.toFixed(2) ?? "—");
                body += `| ${scenario} | ${maes.join(" | ")} | ${rmses.join(" | ")} |\n`;
              }
              body += `\n_${parsed.origins} origins × ${parsed.segments} sensors_\n`;
              body += "\n<details><summary>Raw JSON</summary>\n\n```json\n"
                    + JSON.stringify(parsed, null, 2) + "\n```\n</details>\n";
            }
            body += "\n---\n_Generated by [Claude Code](https://claude.ai/code)_";

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traffic-flow-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest --cov=trafficflow --cov-fail-under=70 --cov-report=term-missing
  docker:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: traffic-flow-analyzer
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t trafficflow-test .
  smoke:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    defaults:
      run:
        working-directory: traffic-flow-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run playwright install chromium
      - run: uv run pytest -m slow -x -q --no-cov
