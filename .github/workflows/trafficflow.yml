name: trafficflow
on:
  push:
    paths: ["traffic-flow-analyzer/**", ".github/workflows/trafficflow.yml"]
  pull_request:
    paths: ["traffic-flow-analyzer/**", ".github/workflows/trafficflow.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traffic-flow-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
