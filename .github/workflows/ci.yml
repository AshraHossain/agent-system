name: CI

on:
  push:
    branches: [main, claude/self-reflective-coding-agent-mzbuhb]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "uv"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v
