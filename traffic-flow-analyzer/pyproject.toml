[project]
name = "trafficflow"
version = "0.1.0"
description = "Traffic Flow Analyzer — congestion forecasting with PydanticAI agents and a Gradio dashboard"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic-ai-slim[openai,google,anthropic]>=1.0",
    "pydantic>=2.7,<3",
    "gradio>=5,<7",
    "plotly>=5.22",
    "pandas>=2.2,<3",
    "numpy>=1.26",
]

[project.scripts]
trafficflow = "trafficflow.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.6", "playwright>=1.44"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trafficflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: needs a real model API key; skipped by default",
    "slow: headless browser or other slow tests; run with -m slow",
]
addopts = "-m 'not live and not slow' -p no:cacheprovider --cov=trafficflow --cov-fail-under=70 --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["trafficflow"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"trafficflow/core/simulate.py" = ["S311"]
